<!DOCTYPE html>
<!-- @dsCard group="Slides" name="Slides / Schedule" subtitle="Time → arrow → topic, on cream" viewport="1280x720" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Schedule slide</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .slide{width:1920px;height:1080px;background:#F5EFE6;padding:120px;box-sizing:border-box;
    transform-origin:center center;position:relative;flex-shrink:0;}
  h2{font-size:96px;font-weight:900;line-height:.95;letter-spacing:-0.02em;text-transform:uppercase;margin:0 0 80px;}
  .row{display:grid;grid-template-columns:200px 80px 1fr;gap:40px;align-items:baseline;padding:32px 0;border-bottom:1.5px solid #000;}
  .time{color:#F39C12;font-weight:900;font-size:64px;font-variant-numeric:tabular-nums;line-height:1;}
  .arrow{display:flex;justify-content:center;}
  .topic{font-size:36px;line-height:1.3;color:#000;}
  .logo{position:absolute;right:120px;bottom:80px;height:80px;}
</style>
</head><body><div class="stage"><div class="slide" id="slide">
  <h2>2 лекции<br>в один день</h2>
  <div class="row"><div class="time">10:00</div><div class="arrow"><svg width="60" height="24" viewBox="0 0 60 24"><line x1="0" y1="12" x2="50" y2="12" stroke="#000" stroke-width="2"/><polyline points="42,4 50,12 42,20" fill="none" stroke="#000" stroke-width="2"/></svg></div><div class="topic">Многоликий кашель у детей</div></div>
  <div class="row"><div class="time">11:00</div><div class="arrow"><svg width="60" height="24" viewBox="0 0 60 24"><line x1="0" y1="12" x2="50" y2="12" stroke="#000" stroke-width="2"/><polyline points="42,4 50,12 42,20" fill="none" stroke="#000" stroke-width="2"/></svg></div><div class="topic">Дифференциальная диагностика заболеваний с бронхообструктивным синдромом у детей</div></div>
  <div class="row"><div class="time">14:00</div><div class="arrow"><svg width="60" height="24" viewBox="0 0 60 24"><line x1="0" y1="12" x2="50" y2="12" stroke="#000" stroke-width="2"/><polyline points="42,4 50,12 42,20" fill="none" stroke="#000" stroke-width="2"/></svg></div><div class="topic">Практическая часть на приёме</div></div>
  <img class="logo" src="../assets/logo/logo_main.svg" alt="">
</div></div>
<script>
  function fit(){const W=innerWidth||document.documentElement.clientWidth;const H=innerHeight||document.documentElement.clientHeight;if(!W||!H)return requestAnimationFrame(fit);const k=Math.min(W/1920,H/1080);document.getElementById('slide').style.transform=`scale(${k})`;})`;}
  fit();addEventListener('resize',fit);
</script>
</body></html>
