<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components / Buttons" subtitle="Primary, secondary, CTA, accent" viewport="700x130" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: #fff; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .btn {
    font-family: var(--font-sans); font-weight: var(--w-bold); font-size: 16px;
    padding: 14px 28px; border: 0; cursor: pointer; transition: all var(--dur-base) var(--ease);
  }
  .primary { background: #000; color: #fff; }
  .primary:hover { background: #F39C12; }
  .secondary { background: #fff; color: #000; border: 1.5px solid #000; }
  .secondary:hover { background: #000; color: #fff; }
  .cta { background: #1E3A8A; color: #fff; border-radius: 999px; padding: 16px 32px; }
  .cta:hover { background: #14296b; }
  .accent { background: #F39C12; color: #000; }
  .accent:hover { background: #E67E22; color: #fff; }
</style>
</head><body>
  <button class="btn primary">Записаться</button>
  <button class="btn secondary">Подробнее</button>
  <button class="btn cta">Старт 24 июля</button>
  <button class="btn accent">Все курсы</button>
</body></html>
