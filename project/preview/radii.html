<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing / Radii" subtitle="Square or pill — nothing in-between" viewport="700x200" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: #fff; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .demo { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .shape { background: #000; }
  .name { font-weight: var(--w-bold); font-size: 13px; text-transform: uppercase; }
  .why  { font-size: 11px; color: var(--fg-muted); }
</style>
</head><body>
<div class="row">
  <div class="demo">
    <div class="shape" style="width:90px;height:60px;border-radius:0"></div>
    <div class="name">0 — square</div>
    <div class="why">posters, K-block, blocks</div>
  </div>
  <div class="demo">
    <div class="shape" style="width:90px;height:60px;border-radius:8px;background:#F39C12"></div>
    <div class="name">8 — soft</div>
    <div class="why">cards, tiles, web UI</div>
  </div>
  <div class="demo">
    <div class="shape" style="width:90px;height:60px;border-radius:16px;background:#1E3A8A"></div>
    <div class="name">16 — rounded</div>
    <div class="why">larger panels, modals</div>
  </div>
  <div class="demo">
    <div class="shape" style="width:120px;height:60px;border-radius:999px;background:#1E3A8A"></div>
    <div class="name">999 — pill / oval</div>
    <div class="why">date, price, tags</div>
  </div>
</div>
</body></html>
