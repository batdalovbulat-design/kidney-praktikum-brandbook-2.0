<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors / Backgrounds" subtitle="White, cream, gradient, glow" viewport="700x160" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Colors — Backgrounds</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fafafa; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .sw { background: var(--white); padding: 16px; }
  .chip { width: 100%; height: 64px; margin-bottom: 12px; border: 1px solid var(--hairline); }
  .name { font-weight: var(--w-bold); font-size: 14px; text-transform: uppercase; }
  .hex  { font-size: 12px; color: var(--fg-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
</style>
</head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FFFFFF;border:1px solid var(--hairline)"></div><div class="name">White</div><div class="hex">Default surface</div></div>
  <div class="sw"><div class="chip" style="background:#F5EFE6"></div><div class="name">Cream</div><div class="hex">#F5EFE6</div></div>
  <div class="sw"><div class="chip" style="background:linear-gradient(135deg,#F39C12,#E67E22)"></div><div class="name">Orange Gradient</div><div class="hex">#F39C12 → #E67E22</div></div>
  <div class="sw"><div class="chip" style="background:radial-gradient(circle at 50% 50%, rgba(243,156,18,0.25), #fff 70%)"></div><div class="name">Glow</div><div class="hex">Logo backdrop</div></div>
</div>
</body></html>
