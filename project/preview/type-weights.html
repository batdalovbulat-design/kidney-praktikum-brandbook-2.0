<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type / Weights" subtitle="Roboto Condensed weights" viewport="700x320" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Type — Weights</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: #fff; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: 80px 1fr 90px; gap: 16px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--hairline); font-size: 28px; }
  .row:last-child { border: 0; }
  .lbl { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; }
  .num { font-size: 11px; color: var(--fg-muted); text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head><body>
<div class="row"><div class="lbl">Light</div><div style="font-weight:300">Кидней Практикум</div><div class="num">300</div></div>
<div class="row"><div class="lbl">Regular</div><div style="font-weight:400">Кидней Практикум</div><div class="num">400</div></div>
<div class="row"><div class="lbl">Medium</div><div style="font-weight:500">Кидней Практикум</div><div class="num">500</div></div>
<div class="row"><div class="lbl">Bold</div><div style="font-weight:700">Кидней Практикум</div><div class="num">700</div></div>
<div class="row"><div class="lbl">Black</div><div style="font-weight:900">Кидней Практикум</div><div class="num">900</div></div>
</body></html>
