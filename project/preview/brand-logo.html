<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand / Logo mark" subtitle="Logo on white, cream, black, orange" viewport="700x420" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: #fff; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .tile { display: flex; align-items: center; justify-content: center; height: 180px; padding: 24px; }
  .light { background: #fff; border: 1px solid var(--hairline); }
  .dark  { background: #000; }
  .orange { background: #F39C12; }
  .cream { background: #F5EFE6; }
  img { height: 56px; width: auto; }
  .inv { filter: invert(1); }
</style>
</head><body>
<div class="tile light"><img src="../assets/logo/logo_main.svg" alt="Кидней Практикум"></div>
<div class="tile cream"><img src="../assets/logo/logo_main.svg" alt="Кидней Практикум"></div>
<div class="tile dark"><img class="inv" src="../assets/logo/logo_main.svg" alt="Кидней Практикум"></div>
<div class="tile orange"><img src="../assets/logo/logo_main.svg" alt="Кидней Практикум"></div>
</body></html>
