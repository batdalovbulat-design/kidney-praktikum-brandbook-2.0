<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components / Schedule row" subtitle="Time → arrow → topic" viewport="700x200" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Schedule row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--cream); font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: 80px 24px 1fr; gap: 16px; align-items: baseline; padding: 14px 0; }
  .time { color: #F39C12; font-weight: var(--w-bold); font-size: 22px; font-variant-numeric: tabular-nums; }
  .arrow svg { display: block; margin-top: 6px; }
  .topic { font-size: 18px; color: #000; line-height: 1.3; }
</style>
</head><body>
<div class="row"><div class="time">10:00</div><div class="arrow"><svg width="20" height="10" viewBox="0 0 20 10"><line x1="0" y1="5" x2="14" y2="5" stroke="#000" stroke-width="1.5"/><polyline points="10,1 14,5 10,9" fill="none" stroke="#000" stroke-width="1.5"/></svg></div><div class="topic">Многоликий кашель у детей</div></div>
<div class="row"><div class="time">11:00</div><div class="arrow"><svg width="20" height="10" viewBox="0 0 20 10"><line x1="0" y1="5" x2="14" y2="5" stroke="#000" stroke-width="1.5"/><polyline points="10,1 14,5 10,9" fill="none" stroke="#000" stroke-width="1.5"/></svg></div><div class="topic">Дифференциальная диагностика заболеваний с бронхообструктивным синдромом</div></div>
</body></html>
