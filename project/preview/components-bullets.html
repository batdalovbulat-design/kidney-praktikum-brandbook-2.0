<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components / Bullet list" subtitle="Course meta · diamond bullets" viewport="700x220" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Bullet list</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: #fff; }
  ul { list-style: none; padding: 0; margin: 0; max-width: 480px; }
  li { font-size: 15px; line-height: 1.5; padding-left: 22px; position: relative; margin-bottom: 6px; }
  li::before { content: ''; position: absolute; left: 0; top: 9px; width: 8px; height: 8px; background: #1E3A8A; transform: rotate(45deg); }
  b { font-weight: var(--w-bold); }
</style>
</head><body>
<ul>
  <li><b>Длительность:</b> 2 недели</li>
  <li><b>Формат:</b> теория + практика</li>
  <li><b>Сертификат:</b> по завершении курса</li>
  <li><b>Стоимость:</b> 22 500 ₽ (рассрочка доступна)</li>
</ul>
</body></html>
