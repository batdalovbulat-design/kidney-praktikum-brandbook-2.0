<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors / Forbidden" subtitle="Reserved for parent clinic" viewport="700x180" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Colors — Forbidden</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fafafa; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .sw { background: var(--white); padding: 16px; position: relative; }
  .chip { width: 100%; height: 64px; margin-bottom: 12px; position: relative; }
  .ban { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .ban::before, .ban::after { content: ''; position: absolute; left: 8%; right: 8%; top: 50%; height: 3px; background: #000; transform-origin: 50% 50%; }
  .ban::before { transform: rotate(8deg); }
  .ban::after  { transform: rotate(-8deg); }
  .name { font-weight: var(--w-bold); font-size: 13px; text-transform: uppercase; }
  .hex  { font-size: 12px; color: var(--fg-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .why  { font-size: 11px; color: var(--fg-muted); margin-top: 4px; }
</style>
</head><body>
<div class="grid">
  <div class="sw">
    <div class="chip" style="background:#E50046"><div class="ban"></div></div>
    <div class="name">Kidney Red — DO NOT USE</div>
    <div class="hex">#E50046</div>
    <div class="why">Parent clinic brand colour</div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#282F5D"><div class="ban"></div></div>
    <div class="name">Kidney Navy — DO NOT USE</div>
    <div class="hex">#282F5D</div>
    <div class="why">Parent clinic supporting colour</div>
  </div>
</div>
</body></html>
