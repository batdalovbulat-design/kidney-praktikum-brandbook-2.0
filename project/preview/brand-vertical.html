<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand / Vertical headline" subtitle="Rotated headline · signature move" viewport="700x380" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Vertical headline</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; height: 360px; box-sizing: border-box; position: relative; }
  .vert {
    position: absolute; left: 56px; top: 50%;
    transform: translateY(-50%) rotate(-90deg); transform-origin: left top;
    font-size: 64px; font-weight: var(--w-black); letter-spacing: -0.02em;
    line-height: 1; text-transform: uppercase; white-space: nowrap;
  }
  .desc { position: absolute; right: 32px; top: 32px; max-width: 320px; font-size: 14px; color: var(--fg-2); line-height: 1.5; }
  .desc b { display: block; font-weight: var(--w-bold); text-transform: uppercase; margin-bottom: 6px; }
</style>
</head><body>
  <div class="vert">Вакцинопрофилактика</div>
  <div class="desc"><b>Vertical headline</b>Headlines rotated −90° on left edge are a Practicum signature. Pair with a circular speaker portrait to the right.</div>
</body></html>
