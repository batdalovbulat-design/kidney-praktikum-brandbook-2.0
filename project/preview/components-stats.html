<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components / Stat block" subtitle="Big-number credentials" viewport="700x180" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Stats</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: #fff; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .stat { border-top: 1.5px solid #000; padding-top: 12px; }
  .num { font-size: 56px; font-weight: var(--w-black); line-height: 1; letter-spacing: -0.02em; }
  .num small { font-size: 28px; font-weight: var(--w-bold); }
  .lbl { font-size: 13px; color: var(--fg-2); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.02em; }
</style>
</head><body>
<div class="stat"><div class="num">576<small> ч.</small></div><div class="lbl">Программа УЗД</div></div>
<div class="stat"><div class="num">50+</div><div class="lbl">Мероприятий</div></div>
<div class="stat"><div class="num">2 000+</div><div class="lbl">Участников</div></div>
</body></html>
