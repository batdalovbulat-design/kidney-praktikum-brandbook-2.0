<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8">
<title>Type — Headlines</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: #fff; }
  .row { display: grid; grid-template-columns: 140px 1fr; gap: 24px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
  .row:last-child { border: 0; }
  .meta { font-size: 11px; color: var(--fg-muted); }
  .meta b { display: block; color: var(--fg); font-weight: var(--w-bold); font-size: 12px; text-transform: uppercase; margin-bottom: 2px; }
</style>
</head><body>
<div class="row"><div class="meta"><b>H1 · 48</b>Bold 700<br>uppercase</div><div class="t-h1">ЦИКЛ ЛЕКЦИЙ ПО НЕЙРОСОНОГРАФИИ</div></div>
<div class="row"><div class="meta"><b>H2 · 36</b>Bold 700<br>uppercase</div><div class="t-h2">ПЫКОВ М.И.</div></div>
<div class="row"><div class="meta"><b>H3 · 24</b>Medium 500</div><div class="t-h3">Расписание модуля</div></div>
</body></html>
