<!DOCTYPE html>
<!-- @dsCard group="Components" name="Components / Arrows" subtitle="Thin black arrows" viewport="700x280" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Arrows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: #fff; }
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--hairline); }
  .row:last-child { border: 0; }
  .lbl { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; width: 110px; flex: none; font-weight: var(--w-bold); }
  .label { font-size: 14px; color: var(--fg-2); }
  svg { display: block; }
</style>
</head><body>
<div class="row">
  <div class="lbl">Horizontal</div>
  <span class="label">спикер</span>
  <svg width="120" height="12" viewBox="0 0 120 12"><line x1="0" y1="6" x2="110" y2="6" stroke="#000" stroke-width="1.5"/><polyline points="100,1 110,6 100,11" fill="none" stroke="#000" stroke-width="1.5"/></svg>
  <span class="label">Пыков М.И.</span>
</div>
<div class="row">
  <div class="lbl">Long</div>
  <svg width="320" height="12" viewBox="0 0 320 12"><line x1="0" y1="6" x2="310" y2="6" stroke="#000" stroke-width="1.5"/><polyline points="300,1 310,6 300,11" fill="none" stroke="#000" stroke-width="1.5"/></svg>
</div>
<div class="row">
  <div class="lbl">Down · L-bend</div>
  <svg width="120" height="80" viewBox="0 0 120 80"><polyline points="10,10 110,10 110,70" stroke="#000" stroke-width="1.5" fill="none"/><polyline points="105,60 110,70 115,60" stroke="#000" stroke-width="1.5" fill="none"/></svg>
</div>
</body></html>
