<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing / Scale" subtitle="4 → 96 px" viewport="700x360" -->
<html lang="ru"><head>
<meta charset="utf-8">
<title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: #fff; }
  .row { display: grid; grid-template-columns: 80px 1fr 60px; gap: 16px; align-items: center; padding: 6px 0; }
  .lbl { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; font-weight: var(--w-bold); }
  .bar { height: 12px; background: #000; }
  .px  { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
</style>
</head><body>
<div class="row"><div class="lbl">1</div><div class="bar" style="width:4px"></div><div class="px">4 px</div></div>
<div class="row"><div class="lbl">2</div><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
<div class="row"><div class="lbl">3</div><div class="bar" style="width:12px"></div><div class="px">12 px</div></div>
<div class="row"><div class="lbl">4</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
<div class="row"><div class="lbl">5</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
<div class="row"><div class="lbl">6</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
<div class="row"><div class="lbl">7</div><div class="bar" style="width:48px"></div><div class="px">48 px</div></div>
<div class="row"><div class="lbl">8</div><div class="bar" style="width:64px"></div><div class="px">64 px</div></div>
<div class="row"><div class="lbl">9</div><div class="bar" style="width:96px"></div><div class="px">96 px</div></div>
</body></html>
