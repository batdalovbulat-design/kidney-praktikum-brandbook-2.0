<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поля формы — Kidney Praktikum Brandbook 2.0 Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <link rel="stylesheet" href="shared.css">
  <style>
    .preview { position: relative; }
    .preview-header { flex-wrap: wrap; }
    .demo-field { scroll-margin-top: var(--space-5); }
  </style>
</head>
<body>
  <main class="preview">
    <header class="preview-header">
      <div><p class="preview-kicker">Компонент · EnrollForm.jsx</p><h1 class="preview-title">Поля записи</h1></div>
      <span class="preview-index">09 / 11</span>
    </header>
    <section class="dark-panel" aria-labelledby="form-preview-title">
      <h2 class="t-h1" id="form-preview-title">Подайте заявку</h2>
      <p class="preview-note" style="margin-top:var(--space-3)">Постоянные подписи, нижняя белая линия, оранжевое действие.</p>
      <div style="display:grid;gap:var(--space-5);margin-top:var(--space-6)">
        <div class="demo-field">
          <label for="preview-name">ФИО</label>
          <input class="demo-input" id="preview-name" name="name" autocomplete="name" placeholder="Магомедова Мадина Гусейновна">
        </div>
        <div class="demo-field">
          <label for="preview-phone">Телефон</label>
          <input class="demo-input" id="preview-phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 ___ ___ __ __">
          <p class="demo-help">Куратор использует номер только для ответа на заявку.</p>
        </div>
        <div class="demo-field">
          <label for="preview-spec">Специализация</label>
          <select class="demo-select" id="preview-spec" name="specialty">
            <option>Педиатр</option><option>УЗД-врач</option><option>Вакцинолог</option><option>Другое</option>
          </select>
        </div>
        <div><button class="demo-button demo-button--orange" type="button">Отправить заявку</button></div>
      </div>
    </section>
    <p class="prototype-note preview-section">Рабочая версия с проверкой, ошибками и успешным состоянием находится в <code>ui_kits/app/components/EnrollForm.jsx</code>.</p>
  </main>
</body>
</html>
